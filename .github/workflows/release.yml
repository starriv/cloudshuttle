# Builds every installer and its signed update when a version tag is pushed,
# and uploads them to a draft release of that tag, which is published by hand.
# See docs/development.md, "发布".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the version of mygo.json
        run: |
          version="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not the version of mygo.json, $version"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One at a time: each build reads the release's SHA256SUMS, merges its
      # own lines and uploads it again, and both macOS builds upload
      # install.sh, so builds uploading together clobber each other.
      max-parallel: 1
      matrix:
        include:
          - { name: macOS universal, os: macos-latest, platform: darwin/universal }
          - { name: macOS Apple silicon, os: macos-latest, platform: darwin/arm64 }
          - { name: Windows x64, os: ubuntu-latest, platform: windows/amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The app is signed with the certificate of macos.signingIdentity, the
      # one the builds on the Mac use: the keychain knows the app by it, so
      # an update signed with another would ask again for every secret.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # The intermediate certificate that issues Apple Development ones.
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          security find-identity -v -p codesigning "$keychain"
      - name: Build and upload
        env:
          CGO_ENABLED: "0"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  # The release keeps what people download, the installers, and what the
  # app updates from, update-*.json and the archives they point to. The
  # builds also upload scripts that install from a terminal, which the app
  # does not offer, and the checksums those scripts check (the release
  # notes list the installers' checksums): they need SHA256SUMS while they
  # build, so it goes once they are done.
  tidy-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Remove the install scripts and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in install.sh install.ps1 SHA256SUMS; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
          done
